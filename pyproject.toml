[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["exaone*", "infrastructure*", "eval*"]

[project]
name = "exaone-cookbook"
version = "0.1.0"
description = "EXAONE Cookbook: Track 00–10 recipes, exaone library, eval harness, and optional Proof Gallery implementations."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "datasets>=2.14.0",
    "ddgs>=6.0.0",
    "fastapi>=0.100.0",
    "gradio>=6.0",
    "grandalf>=0.8.0",
    "httpx>=0.27.0",
    "huggingface-hub>=0.20.0",
    "ipykernel>=6.0.0",
    "jsonschema>=4.20.0",
    "jupyter>=1.0.0",
    "kiwipiepy>=0.18.0",
    "langdetect>=1.0.9",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "llama-index-core>=0.11.0",
    "llama-index-embeddings-huggingface>=0.2.0",
    "llama-index-llms-openai>=0.2.0",
    "llama-index-vector-stores-postgres>=0.2.0",
    "mcp[cli]>=1.0,<2.0",
    "nltk>=3.9.0",
    "openai>=2.26.0",
    "psycopg[binary]>=3.1.0",
    "python-dotenv>=1.0.0",
    "requests>=2.28.0",
    "sentence-transformers>=2.2.0",
    "spacy>=3.7.0",
    "tiktoken>=0.7.0",
    "uvicorn>=0.23.0",
]

[project.optional-dependencies]
eval-taubench = [
    "tau-bench @ git+https://github.com/sierra-research/tau-bench.git",
]
