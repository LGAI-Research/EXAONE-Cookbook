[pytest]
testpaths = test
python_files = test_*.py
python_functions = test_*
norecursedirs = perf .git __pycache__ .pytest_cache
# (en) Prevent agent tests from hanging — fail after 10s.
# (kr) 에이전트 테스트 멈춤 방지 — 10초 초과 시 실패.
timeout = 10
addopts = -v --tb=short
markers =
    integration: tests that require DB or external API (deselect with -m "not integration")
    eval_datasets: HF download / optional tau-bench loader smoke (deselect with -m "not eval_datasets")
    live: live EXAONE API probes (set RUN_LIVE_TURN=1; deselect with -m "not live")
# (en) If LangSmith plugin stalls collection, run: pytest -p no:langsmith test/ -q
# (kr) LangSmith 플러그인으로 수집이 멈추면: pytest -p no:langsmith test/ -q
