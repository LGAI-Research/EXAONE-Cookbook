[project]
name = "exaone-impl-crewai"
version = "0.0.0"
description = "EXAONE Proof Gallery — CrewAI glue (isolated uv env)"
requires-python = ">=3.10"
dependencies = [
    "exaone",
    "crewai>=1.15,<2",
    "litellm>=1.0",
]

[tool.uv]
package = false

[tool.uv.sources]
exaone = { path = "../../exaone", editable = true }
